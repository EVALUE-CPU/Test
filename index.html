<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVALUE 5歲生日快樂活動 — 積分查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --gold: #ffd700;
    --pink: #ff2d78;
    --purple: #7b2fff;
    --green: #00ff9d;
    --orange: #ff8c00;
    --bg: #060614;
    --card: rgba(255,255,255,0.04);
    --border: rgba(0,245,255,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #e0e8ff;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background ── */
  .bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-glow::before {
    content: '';
    position: absolute; top: -20%; left: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(255,140,0,0.14) 0%, transparent 70%);
    animation: drift1 13s ease-in-out infinite alternate;
  }
  .bg-glow::after {
    content: '';
    position: absolute; bottom: -10%; right: -5%;
    width: 55vw; height: 55vw;
    background: radial-gradient(circle, rgba(0,245,255,0.11) 0%, transparent 70%);
    animation: drift2 16s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from{transform:translate(0,0)} to{transform:translate(6vw,8vh)} }
  @keyframes drift2 { from{transform:translate(0,0)} to{transform:translate(-5vw,-7vh)} }

  /* confetti-style floating dots */
  .confetti-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .confetti-bg span {
    position: absolute;
    border-radius: 50%;
    animation: float-up linear infinite;
    opacity: 0;
  }
  @keyframes float-up {
    0%   { transform: translateY(100vh) scale(0.6); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 700px; margin: 0 auto;
    padding: clamp(12px,3vw,24px);
  }

  /* ── Header ── */
  header { text-align: center; padding: clamp(28px,6vw,52px) 0 clamp(20px,4vw,32px); }

  .birthday-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(255,140,0,0.2), rgba(255,45,120,0.2));
    border: 1px solid rgba(255,140,0,0.55);
    border-radius: 20px; padding: 5px 18px;
    font-size: clamp(11px,2.2vw,13px);
    font-family: 'Orbitron', sans-serif;
    color: var(--orange); letter-spacing: 1px; margin-bottom: 18px;
  }
  .badge-dot {
    width: 8px; height: 8px;
    background: var(--orange); border-radius: 50%;
    animation: pulse-dot 1.4s infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); box-shadow:0 0 0 0 rgba(255,140,0,0.6); }
    50%      { opacity:0.7; transform:scale(0.7); box-shadow:0 0 0 4px transparent; }
  }

  .title-eyebrow {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(11px,2.3vw,14px);
    letter-spacing: 4px;
    color: rgba(224,232,255,0.45);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px,5.5vw,44px); font-weight: 900;
    line-height: 1.15;
    background: linear-gradient(135deg, var(--orange) 0%, var(--pink) 45%, var(--cyan) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .title-sub {
    font-size: clamp(12px,2.4vw,15px);
    color: rgba(224,232,255,0.5);
    margin-top: 10px; letter-spacing: 2px;
  }
  .title-sub span { color: var(--gold); }

  /* cake decoration */
  .cake-row {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin-top: 14px; font-size: clamp(20px,5vw,32px);
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
  }
  .candle { animation: flicker 0.8s ease-in-out infinite alternate; }
  @keyframes flicker {
    from { transform: scaleY(1) rotate(-1deg); filter: brightness(1); }
    to   { transform: scaleY(0.92) rotate(1deg); filter: brightness(1.3); }
  }

  /* ── Search ── */
  .search-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: clamp(16px,4vw,28px);
    backdrop-filter: blur(14px); margin-bottom: clamp(14px,3vw,22px);
  }
  .search-title {
    font-size: clamp(12px,2.3vw,14px); color: rgba(224,232,255,0.55);
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .search-row { display: flex; gap: 10px; }
  .search-input {
    flex: 1; background: rgba(0,0,0,0.38); border: 1px solid var(--border);
    border-radius: 11px; padding: 13px 16px; color: #fff;
    font-family: 'Orbitron', sans-serif; font-size: clamp(13px,2.5vw,16px);
    letter-spacing: 2px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus { border-color: var(--cyan); box-shadow: 0 0 18px rgba(0,245,255,0.2); }
  .search-input::placeholder { color: rgba(255,255,255,0.18); letter-spacing: 1px; }
  .search-btn {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    border: none; border-radius: 11px; padding: 13px 24px;
    color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: clamp(12px,2vw,14px); cursor: pointer; white-space: nowrap;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .search-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,140,0,0.4); }
  .search-btn:active { transform: translateY(0); }
  .error-msg {
    display: none; color: var(--pink); font-size: clamp(11px,2vw,13px);
    margin-top: 10px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
  }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* ── Account Card ── */
  #account-card {
    display: none; background: var(--card);
    border: 1px solid rgba(255,140,0,0.35);
    border-radius: 18px; padding: clamp(16px,4vw,28px);
    backdrop-filter: blur(14px); margin-bottom: clamp(14px,3vw,22px);
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  .account-top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .avatar {
    font-size: clamp(28px,5.5vw,40px);
    width: clamp(54px,11vw,66px); height: clamp(54px,11vw,66px);
    background: rgba(255,140,0,0.1); border: 2px solid rgba(255,140,0,0.4);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .account-info { flex: 1; }
  .account-name { font-family: 'Orbitron', sans-serif; font-size: clamp(13px,2.5vw,16px); color: #fff; letter-spacing: 2px; margin-bottom: 5px; }
  .account-rank { font-size: clamp(11px,2vw,13px); color: rgba(224,232,255,0.48); }
  .account-rank span { color: var(--gold); font-weight: 700; font-family: 'Orbitron', sans-serif; }
  .score-display { text-align: center; }
  .score-num {
    font-family: 'Orbitron', sans-serif; font-size: clamp(48px,11vw,76px); font-weight: 900;
    color: var(--orange); line-height: 1; display: block;
    text-shadow: 0 0 28px rgba(255,140,0,0.75), 0 0 56px rgba(255,140,0,0.35);
  }
  .score-label { font-size: clamp(11px,2vw,13px); color: rgba(224,232,255,0.38); letter-spacing: 3px; margin-top: 5px; }

  /* ══════════════════════════════════════════
     🌡️  THERMOMETER + PRIZES
     ══════════════════════════════════════════ */
  .prizes-section {
    display: none; background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: clamp(16px,4vw,28px);
    backdrop-filter: blur(14px); margin-bottom: clamp(14px,3vw,22px);
  }
  .prizes-section.visible { display: block; animation: fadeUp 0.45s ease; }

  .section-title {
    font-family: 'Orbitron', sans-serif; font-size: clamp(12px,2.5vw,14px);
    color: var(--orange); letter-spacing: 2px;
    margin-bottom: clamp(16px,3vw,24px);
    display: flex; align-items: center; gap: 8px;
  }

  .prizes-layout { display: flex; gap: clamp(14px,3vw,26px); align-items: stretch; }

  /* Thermometer column */
  .thermo-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 38px; }
  .thermo-tube {
    position: relative; width: 15px; flex: 1; min-height: 220px;
    border-radius: 10px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.09);
    overflow: visible;
  }
  .thermo-fill {
    position: absolute; bottom: 0; left: 0; right: 0; border-radius: 10px;
    background: linear-gradient(to top, var(--green) 0%, var(--cyan) 40%, var(--orange) 80%, var(--pink) 100%);
    box-shadow: 0 0 10px rgba(0,255,157,0.5), 0 0 22px rgba(0,245,255,0.28);
    height: 0%;
    transition: height 1.2s cubic-bezier(0.34,1.4,0.64,1);
  }
  .thermo-fill::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent 20%, rgba(255,255,255,0.3) 50%, transparent 80%);
    animation: shimmer 2.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0%{transform:translateX(-160%)} 100%{transform:translateX(260%)} }

  .thermo-node {
    position: absolute; left: 50%; transform: translate(-50%, 50%);
    width: 13px; height: 13px; border-radius: 50%;
    background: rgba(255,255,255,0.09); border: 2px solid rgba(255,255,255,0.2);
    transition: background 0.5s, border-color 0.5s, box-shadow 0.5s; z-index: 3;
  }
  .thermo-node.lit {
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 10px var(--green), 0 0 24px rgba(0,255,157,0.55);
    animation: node-ping 2s ease-in-out infinite;
  }
  @keyframes node-ping {
    0%,100% { box-shadow: 0 0 8px var(--green), 0 0 16px rgba(0,255,157,0.4); }
    50%      { box-shadow: 0 0 16px var(--green), 0 0 34px rgba(0,255,157,0.7); }
  }
  .thermo-connector {
    position: absolute; left: calc(100% + 1px); height: 1px;
    background: linear-gradient(90deg, rgba(0,255,157,0.5), transparent);
    width: clamp(12px,3vw,26px); top: 50%; transform: translateY(-50%);
    pointer-events: none; opacity: 0.35; transition: opacity 0.4s;
  }
  .thermo-node.lit .thermo-connector { opacity: 0.85; }
  .thermo-bulb {
    width: 22px; height: 22px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, var(--green), #009eb0);
    box-shadow: 0 0 14px rgba(0,255,157,0.7), 0 0 28px rgba(0,245,255,0.4);
  }

  /* Prize list */
  .prize-list { flex: 1; display: flex; flex-direction: column; gap: 7px; }

  .prize-item {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: clamp(9px,1.8vw,13px) clamp(11px,2.2vw,16px);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.025); overflow: hidden;
    transition: border-color 0.45s, background 0.45s, box-shadow 0.45s, filter 0.45s;
  }
  .prize-item.locked { filter: saturate(0.12) brightness(0.6); }
  .prize-item.unlocked {
    border-color: rgba(0,255,157,0.5);
    background: rgba(0,255,157,0.055);
    box-shadow: 0 0 20px rgba(0,255,157,0.1), inset 0 0 16px rgba(0,255,157,0.04);
    filter: none;
  }
  .prize-item.just-unlocked { animation: prize-pop 0.6s cubic-bezier(0.34,1.7,0.64,1); }
  @keyframes prize-pop { 0%{transform:scale(1)} 45%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .prize-item::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(105deg, transparent 30%, rgba(0,255,157,0.2) 50%, transparent 70%);
    transform: translateX(-120%);
  }
  .prize-item.just-unlocked::before { animation: sheen 0.6s ease forwards; }
  @keyframes sheen { 0%{transform:translateX(-120%)} 100%{transform:translateX(130%)} }

  /* prize icon with tier color */
  .prize-icon { font-size: clamp(17px,3.5vw,22px); flex-shrink: 0; line-height: 1; transition: transform 0.35s; }
  .prize-item.unlocked .prize-icon { transform: scale(1.18); }

  .prize-body { flex: 1; min-width: 0; }
  .prize-name {
    font-size: clamp(11px,2vw,14px); font-weight: 700;
    color: rgba(224,232,255,0.48); transition: color 0.45s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prize-item.unlocked .prize-name { color: #fff; }

  .prize-meta {
    display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap;
  }
  .prize-pts {
    font-family: 'Orbitron', sans-serif; font-size: clamp(8px,1.6vw,10px);
    color: rgba(224,232,255,0.25); transition: color 0.45s;
  }
  .prize-item.unlocked .prize-pts { color: var(--cyan); }

  /* winner count pill */
  .winner-count {
    font-family: 'Orbitron', sans-serif; font-size: clamp(8px,1.5vw,10px);
    padding: 1px 7px; border-radius: 20px;
    background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.25);
    color: rgba(255,215,0,0.55);
    transition: background 0.45s, border-color 0.45s, color 0.45s;
    white-space: nowrap;
  }
  .prize-item.unlocked .winner-count {
    background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.5); color: var(--gold);
  }

  /* mini bar */
  .prize-bar { width: clamp(40px,7vw,72px); flex-shrink: 0; }
  @media (max-width:500px) { .prize-bar { display: none; } }
  .bar-track { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green));
    border-radius: 2px; width: 0%; transition: width 1.1s ease;
  }
  .bar-pct { font-family: 'Orbitron', sans-serif; font-size: 8px; color: rgba(224,232,255,0.25); text-align: right; margin-top: 3px; transition: color 0.45s; }
  .prize-item.unlocked .bar-pct { color: var(--green); }

  /* UNLOCKED badge */
  .unlock-badge {
    font-family: 'Orbitron', sans-serif; font-size: clamp(7px,1.3vw,9px); font-weight: 700;
    letter-spacing: 0.5px; padding: 2px 7px; border-radius: 5px;
    background: var(--green); color: #000; flex-shrink: 0;
    opacity: 0; transform: scale(0.65) translateY(5px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.6,0.64,1);
  }
  .prize-item.unlocked .unlock-badge { opacity: 1; transform: scale(1) translateY(0); }
  .lock-icon {
    position: absolute; right: 10px; font-size: 13px; opacity: 0.25;
    transition: opacity 0.45s; pointer-events: none;
  }
  .prize-item.unlocked .lock-icon { opacity: 0; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: linear-gradient(135deg, rgba(0,255,157,0.15), rgba(255,140,0,0.15));
    border: 1px solid var(--green); border-radius: 12px;
    padding: 11px 22px; font-family: 'Orbitron', sans-serif; font-size: 12px;
    color: var(--green); letter-spacing: 1px; z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    opacity: 0; pointer-events: none; white-space: nowrap; backdrop-filter: blur(14px);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── Stars ── */
  .star { position: fixed; pointer-events: none; z-index: 998; font-size: 20px; animation: starBurst 1s ease-out forwards; }
  @keyframes starBurst { 0%{transform:translate(0,0) scale(0);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0} }

  /* ── Footer ── */
  .footer {
    text-align: center; padding: clamp(16px,4vw,28px) 0;
    font-size: clamp(10px,1.8vw,12px); color: rgba(224,232,255,0.2);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="grid-bg"></div>
<div class="confetti-bg" id="confetti-bg"></div>

<div class="container">

  <!-- Header -->
  <header>
    <div class="birthday-badge"><span class="badge-dot"></span>5th Anniversary Event</div>
    <div class="title-eyebrow">E V A L U E</div>
    <h1>5歲生日快樂🎂</h1>
    <p class="title-sub">充電每一次 · 積分 <span>回饋</span> 滿滿</p>
    <div class="cake-row">
      <span class="candle">🕯️</span>
      <span>🎂</span>
      <span class="candle" style="animation-delay:0.3s">🕯️</span>
      <span>🎁</span>
      <span class="candle" style="animation-delay:0.6s">🕯️</span>
      <span>🎉</span>
      <span class="candle" style="animation-delay:0.15s">🕯️</span>
      <span>🎈</span>
      <span class="candle" style="animation-delay:0.45s">🕯️</span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-card">
    <div class="search-title">🔍 輸入手機號碼查詢個人積分</div>
    <div class="search-row">
      <input class="search-input" id="phone-input" type="tel" placeholder="09XXXXXXXX" maxlength="10">
      <button class="search-btn" onclick="doSearch()">查詢</button>
    </div>
    <div class="error-msg" id="error-msg">⚠ 查無此號碼，請確認後重新輸入</div>
  </div>

  <!-- Account Card -->
  <div id="account-card">
    <div class="account-top">
      <div class="avatar" id="user-emoji">🎂</div>
      <div class="account-info">
        <div class="account-name" id="user-phone">09XXXXXXXX</div>
        <div class="account-rank">全站排名：<span id="user-rank">#1</span> / 28,291 人</div>
      </div>
    </div>
    <div class="score-display">
      <span class="score-num" id="user-score">0</span>
      <div class="score-label">TOTAL POINTS</div>
    </div>
  </div>

  <!-- Prizes + Thermometer -->
  <div class="prizes-section" id="prizes-section">
    <div class="section-title">🏆 獎品解鎖進度</div>
    <div class="prizes-layout">

      <div class="thermo-col">
        <div class="thermo-tube" id="thermo-tube">
          <div class="thermo-fill" id="thermo-fill"></div>
        </div>
        <div class="thermo-bulb"></div>
      </div>

      <div class="prize-list" id="prize-list"></div>
    </div>
  </div>

  <div class="footer">EVALUE · 5th Anniversary · 2024–2025</div>

</div>

<div id="toast"></div>

<script>
/* ── Injected data ── */
const ALL_DATA    = ALL_DATA_PLACEHOLDER;
const LEADERBOARD = LEADERBOARD_PLACEHOLDER;

/* ── Prize config (with real winner counts) ── */
const PRIZES = [
  { icon:'🌟', name:'EVALUE 萬元點數',          pts:10000, winners:   0 },
  { icon:'⚡', name:'2026 3天免費充電方案',       pts: 5000, winners:   0 },
  { icon:'💎', name:'EVALUE 500點',              pts: 2500, winners:   0 },
  { icon:'🔋', name:'2026 1天免費充電方案',       pts: 2000, winners:   0 },
  { icon:'🎯', name:'DC 快充 50% 回饋券 x3',     pts: 1500, winners:   1 },
  { icon:'🎁', name:'EVALUE 500點',              pts: 1000, winners:  10 },
  { icon:'⚡', name:'DC 快充 50% 回饋券 x1',     pts:  750, winners:  21 },
  { icon:'🎫', name:'DC 快充 25% 回饋券 x3',     pts:  500, winners:  91 },
  { icon:'☕', name:'EVALUE 50點',               pts:  300, winners: 374 },
];
const MAX_PTS = PRIZES[0].pts;   // highest threshold = 10000
const EMOJIS  = ['🦁','🐯','🦊','🐼','🦄','🐉','🦋','🌟','🔥','⚡','🎯','🏆','💎','🚀','🌈','🦅','🎸','🌙','⭐','🎪'];

let currentPhone = null;

/* ── Floating confetti dots ── */
(function spawnConfetti() {
  const colors = ['#ffd700','#ff8c00','#ff2d78','#00f5ff','#00ff9d','#7b2fff'];
  const wrap = document.getElementById('confetti-bg');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    const sz = 4 + Math.random() * 6;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      animation-duration:${10 + Math.random()*14}s;
      animation-delay:${Math.random()*-20}s;
    `;
    wrap.appendChild(s);
  }
})();

/* ════════ Search ════════ */
function doSearch() {
  const raw   = document.getElementById('phone-input').value.trim();
  const phone = raw.startsWith('0') ? raw : '0' + raw;
  const err   = document.getElementById('error-msg');

  if (!ALL_DATA[phone]) {
    err.style.display = 'block';
    err.style.animation = 'none';
    void err.offsetWidth;
    err.style.animation = 'shake 0.3s ease';
    document.getElementById('account-card').style.display = 'none';
    document.getElementById('prizes-section').classList.remove('visible');
    return;
  }

  err.style.display = 'none';
  currentPhone = phone;
  const { rank, score } = ALL_DATA[phone];
  const ei = (parseInt(phone.slice(-2)) || 0) % EMOJIS.length;

  document.getElementById('user-emoji').textContent = EMOJIS[ei];
  document.getElementById('user-phone').textContent = phone;
  document.getElementById('user-rank').textContent  = '#' + rank.toLocaleString();
  document.getElementById('user-score').textContent = score.toLocaleString();

  document.getElementById('account-card').style.display = 'block';
  document.getElementById('prizes-section').classList.add('visible');

  setTimeout(() => renderPrizes(score), 90);
  document.getElementById('account-card').scrollIntoView({ behavior:'smooth', block:'center' });
}
document.getElementById('phone-input').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

/* ════════════════════════════════
   🌡️  renderPrizes
   PRIZES array is already HIGH→LOW
   ════════════════════════════════ */
function renderPrizes(score) {
  const list = document.getElementById('prize-list');
  list.innerHTML = '';

  PRIZES.forEach(p => {
    const unlocked = score >= p.pts;
    const pct      = Math.min(100, Math.round((score / p.pts) * 100));
    const winnersLabel = p.winners === 0
      ? '尚無人達標'
      : `${p.winners.toLocaleString()} 人已解鎖`;

    const div = document.createElement('div');
    div.className   = 'prize-item ' + (unlocked ? 'unlocked' : 'locked');
    div.dataset.pts = p.pts;
    div.innerHTML = `
      <div class="prize-icon">${p.icon}</div>
      <div class="prize-body">
        <div class="prize-name">${p.name}</div>
        <div class="prize-meta">
          <span class="prize-pts">${p.pts.toLocaleString()} pts</span>
          <span class="winner-count">🏅 ${winnersLabel}</span>
        </div>
      </div>
      <div class="prize-bar">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div>
      <div class="unlock-badge">UNLOCKED</div>
      ${!unlocked ? '<div class="lock-icon">🔒</div>' : ''}
    `;
    list.appendChild(div);
  });

  requestAnimationFrame(() => placeNodes(score));
}

/* ════════ Thermometer nodes ════════ */
function placeNodes(score) {
  const tube  = document.getElementById('thermo-tube');
  const fill  = document.getElementById('thermo-fill');
  const items = document.getElementById('prize-list').querySelectorAll('.prize-item');

  tube.querySelectorAll('.thermo-node').forEach(n => n.remove());

  const tubeR = tube.getBoundingClientRect();
  const tubeH = tubeR.height;
  if (!tubeH) return;

  PRIZES.forEach((p, i) => {
    const itemR    = items[i].getBoundingClientRect();
    const centY    = itemR.top + itemR.height / 2;
    const fracBot  = 1 - (centY - tubeR.top) / tubeH;
    const pct      = Math.max(2, Math.min(98, fracBot * 100));

    const node = document.createElement('div');
    node.className = 'thermo-node' + (score >= p.pts ? ' lit' : '');
    node.style.bottom = pct + '%';

    const line = document.createElement('div');
    line.className = 'thermo-connector';
    node.appendChild(line);
    tube.appendChild(node);
  });

  /* fill height: map score linearly up to MAX_PTS, max 100% */
  fill.style.height = Math.min(100, (score / MAX_PTS) * 100) + '%';

  /* stagger unlock pop animations */
  const unlocked = Array.from(document.querySelectorAll('.prize-item.unlocked'));
  if (unlocked.length > 0) {
    unlocked.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('just-unlocked');
        setTimeout(() => el.classList.remove('just-unlocked'), 650);
      }, i * 120);
    });
    setTimeout(() => {
      showToast(`🎉 恭喜！已解鎖 ${unlocked.length} 項獎品`);
      burst(window.innerWidth / 2, window.innerHeight * 0.4);
    }, 700);
  }
}

/* re-align on resize */
let _rt;
window.addEventListener('resize', () => {
  clearTimeout(_rt);
  _rt = setTimeout(() => {
    if (currentPhone && ALL_DATA[currentPhone]) placeNodes(ALL_DATA[currentPhone].score);
  }, 140);
});

/* ════════ Toast ════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3600);
}

/* ════════ Burst ════════ */
function burst(x, y) {
  const s = ['🎉','✨','🎈','🌟','💫','🎊','⭐'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = s[Math.floor(Math.random() * s.length)];
    const a = (i / 16) * 360, d = 65 + Math.random() * 120;
    el.style.setProperty('--dx', Math.cos(a * Math.PI/180) * d + 'px');
    el.style.setProperty('--dy', Math.sin(a * Math.PI/180) * d + 'px');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
}
</script>
